[versions]
# Kept in sync with Google's Now in Android sample (verified working combo)
agp = "9.3.2"
kotlin = "2.3.0"
composeBom = "2025.09.01"
activity = "1.9.3"
junit = "4.13.2"
# Phase 1: Firebase + Hilt + Credential Manager
firebaseBom = "35.0.1"
gms = "4.5.0"
hilt = "2.59"
hiltNavigationCompose = "1.2.0"
androidxHilt = "1.2.0"
ksp = "2.3.4"
lifecycle = "2.10.0"
credentials = "1.6.0"
coroutines = "1.10.1"
googleid = "1.2.1"
# Phase 2: scan + AI reading
mlkitDocScanner = "16.0.0-beta1"
camerax = "1.6.1"
cropper = "4.7.0"
coil = "2.7.0"
navigation = "2.8.5"
serializationJson = "1.8.0"
# Phase 3: drug database
room = "2.8.3"
# Phase 4: online search + images (versions from Now in Android catalog)
retrofit = "2.11.0"
okhttp = "4.12.0"
work = "2.10.0"
datastore = "1.2.0"
browser = "1.8.0"

