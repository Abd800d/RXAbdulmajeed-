name: APH V2 quality and Flutter preview

on:
  push:
    branches:
      - arena/b4802f14-rxabdulmajeed
    paths:
      - "apps/aph_mobile/**"
      - "services/api/**"
      - "supabase/migrations/**"
      - "scripts/validate-migration.mjs"
      - ".github/workflows/v2-quality.yml"
  pull_request:
    paths:
      - "apps/aph_mobile/**"
      - "services/api/**"
      - "supabase/migrations/**"
      - "scripts/validate-migration.mjs"
      - ".github/workflows/v2-quality.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: aph-v2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: FastAPI lint, types, and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/api/pyproject.toml
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[test]'
      - run: ruff check app tests
      - run: mypy app
      - run: pytest

  migrations:
    name: V1 and V2 PostgreSQL migration validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:migration

  flutter:
    name: Flutter analyze, test, APK, and AAB
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/aph_mobile
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter --version
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: dart format lib test
      - name: Analyze Flutter source
        shell: bash
        run: |
          set +e
          flutter analyze --fatal-infos > /tmp/flutter-analyze.log 2>&1
          status=$?
          cat /tmp/flutter-analyze.log
          if [ "$status" -ne 0 ]; then
            while IFS= read -r line; do
              escaped="${line//'%'/'%25'}"
              escaped="${escaped//$'\r'/'%0D'}"
              escaped="${escaped//$'\n'/'%0A'}"
              echo "::error title=Flutter analyzer::$escaped"
            done < /tmp/flutter-analyze.log
          fi
          exit "$status"
      - name: Test Flutter application
        shell: bash
        run: |
          set +e
          timeout 240s flutter test --timeout 60s > /tmp/flutter-test.log 2>&1
          status=$?
          cat /tmp/flutter-test.log
          if [ "$status" -ne 0 ]; then
            while IFS= read -r line; do
              escaped="${line//'%'/'%25'}"
              escaped="${escaped//$'\r'/'%0D'}"
              escaped="${escaped//$'\n'/'%0A'}"
              echo "::error title=Flutter tests::$escaped"
            done < /tmp/flutter-test.log
          fi
          exit "$status"
      - run: flutter build apk --release
      - run: flutter build appbundle --release
      - name: Name transition artifacts and calculate checksums
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk APH-Flutter-V2-preview.apk
          cp build/app/outputs/bundle/release/app-release.aab APH-Flutter-V2-preview.aab
          sha256sum APH-Flutter-V2-preview.apk APH-Flutter-V2-preview.aab > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: APH-Flutter-V2-transition-builds
          path: |
            apps/aph_mobile/APH-Flutter-V2-preview.apk
            apps/aph_mobile/APH-Flutter-V2-preview.aab
            apps/aph_mobile/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

  publish-preview-apk:
    name: Publish separately named Flutter preview APK
    if: github.event_name == 'push' && github.ref == 'refs/heads/arena/b4802f14-rxabdulmajeed'
    needs: [api, migrations, flutter]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: arena/b4802f14-rxabdulmajeed
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: APH-Flutter-V2-transition-builds
          path: /tmp/aph-v2-artifacts
      - name: Publish preview without replacing V1.1.0
        run: |
          cp /tmp/aph-v2-artifacts/APH-Flutter-V2-preview.apk ./APH-Flutter-V2-preview.apk
          grep 'APH-Flutter-V2-preview.apk' /tmp/aph-v2-artifacts/SHA256SUMS.txt > APH-Flutter-V2-preview.sha256
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f APH-Flutter-V2-preview.apk APH-Flutter-V2-preview.sha256
          if git diff --cached --quiet; then
            echo "Flutter preview APK is already current."
            exit 0
          fi
          git commit -m "build: publish APH Flutter V2 preview APK"
          git pull --rebase origin arena/b4802f14-rxabdulmajeed
          git push origin HEAD:arena/b4802f14-rxabdulmajeed
