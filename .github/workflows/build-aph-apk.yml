name: Build APH Android APK

on:
  push:
    branches:
      - arena/b4802f14-rxabdulmajeed
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    name: Assemble installable APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Install dependencies
        run: npm ci

      - name: Test web application
        run: npm test

      - name: Build web application
        run: npm run build

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Assemble signed debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Name APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk APH-AbdulmajeedPharma-v1.0.0.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: APH-AbdulmajeedPharma-APK
          path: APH-AbdulmajeedPharma-v1.0.0.apk
          if-no-files-found: error
          retention-days: 30
