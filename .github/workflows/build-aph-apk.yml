name: Build APH Android APK

on:
  push:
    branches:
      - arena/b4802f14-rxabdulmajeed
    paths-ignore:
      - 'APH-*.apk'
      - 'gradle-build.log'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    name: Assemble installable APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Install dependencies
        run: npm ci

      - name: Test web application
        run: npm test

      - name: Build web application
        run: npm run build

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Assemble signed debug APK
        shell: bash
        run: |
          set +e
          chmod +x android/gradlew
          (cd android && ./gradlew assembleDebug --no-daemon --stacktrace) 2>&1 | tee gradle-build.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            echo "Gradle failed with exit code $status"
            exit "$status"
          fi

      - name: Save failed Gradle log to branch
        if: failure()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f gradle-build.log
          git commit -m "[skip ci] Save failed Android build log"
          git push

      - name: Name APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk APH-AbdulmajeedPharma-v1.0.0.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: APH-AbdulmajeedPharma-APK
          path: APH-AbdulmajeedPharma-v1.0.0.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish APK to branch for direct retrieval
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f APH-AbdulmajeedPharma-v1.0.0.apk
          git commit -m "[skip ci] Publish APH Android APK"
          git push
